name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Python version comes from .python-version (3.14).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Real-SNID tests are skipped here (no templates), so this number is
      # the CI-visible coverage, measured at ~96% when the threshold was set.
      - name: Run tests with coverage
        run: uv run pytest --cov --cov-fail-under=95
