[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bosscat"
version = "0.1.0"
description = "BOSS Classification Analysis Toolkit"
authors = [
    {name = "Benjamin Rose", email = "ben_rose@baylor.edu"},
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0",
    "snid-sage>=1.0",
]

[project.scripts]
bosscat = "bosscat.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["bosscat"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "snid_real: runs real SNID-SAGE; needs templates; skipped in CI",
]

[tool.coverage.run]
source = ["bosscat"]
branch = true

[tool.coverage.report]
show_missing = true
